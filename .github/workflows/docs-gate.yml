name: Documentation Freshness Gate

on:
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'scripts/lint-docs.ts'
      - '.github/workflows/docs-gate.yml'
  pull_request:
    branches: [main]
    paths:
      - '**.md'
      - 'scripts/lint-docs.ts'
      - '.github/workflows/docs-gate.yml'

jobs:
  lint-docs:
    name: Lint Markdown & Verify Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Documentation Linter & Link Gate
        run: npm run lint:docs
